name: V28.1 national signal provenance audit
on:
  workflow_dispatch:
concurrency:
  group: v281-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.head_ref == 'experiment/municipal-v13-aps-source-20261125' || github.ref == 'refs/heads/experiment/municipal-v13-aps-source-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_signal_audit_v281.py
      - uses: actions/download-artifact@v4
        with:
          name: v241-robust-heads
          run-id: 46060624437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v281_frozen
      - run: python -m scripts.modeling.signal_audit_v281 --frozen reports/generated/v281_frozen/object_metrics.csv --output reports/generated/v281_audit
      - uses: actions/upload-artifact@v4
        with:
          name: v281-signal-audit
          path: reports/generated/v281_audit/
          if-no-files-found: error
          retention-days: 30
