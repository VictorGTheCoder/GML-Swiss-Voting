name: V8 inductive factorization benchmark
on:
  pull_request:
    paths:
      - 'scripts/modeling/inductive_profiles_v8.py'
      - 'tests/test_inductive_profiles_v8.py'
      - '.github/workflows/inductive-profiles-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inductive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-experiments.txt
      - name: Check inductive kernel and rank constraints
        run: python -m pytest -q tests/test_inductive_profiles_v8.py
      - name: Prepare historical data
        run: >-
          python -m scripts.modeling.municipal_v2 prepare
          --output reports/generated/inductive_v8_base
      - name: Evaluate profiles with nested chronological selection
        run: >-
          python -m scripts.modeling.inductive_profiles_v8
          --base reports/generated/inductive_v8_base
          --output reports/generated/inductive_v8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inductive-profiles-v8
          path: reports/generated/inductive_v8/
          if-no-files-found: warn
          retention-days: 30
