name: V10.5 direct canton forecasts
on:
  pull_request:
    paths:
      - 'scripts/modeling/canton_v105.py'
      - 'tests/test_canton_v105.py'
      - '.github/workflows/canton-v105.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  canton:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_canton_v105.py
      - uses: actions/download-artifact@v4
        with:
          name: poll-acquisition-v81
          run-id: 45292731014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/acquisition_v81
      - uses: actions/download-artifact@v4
        with:
          name: national-fusion-v81
          run-id: 45293115635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/national_v81
      - uses: actions/download-artifact@v4
        with:
          name: v103-turnout
          run-id: 45316679885
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/turnout_v103
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/v105_base
      - run: python -m scripts.modeling.canton_v105 --base reports/generated/v105_base --acquisition reports/generated/acquisition_v81 --fusion reports/generated/national_v81 --turnout reports/generated/turnout_v103 --output reports/generated/canton_v105
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v105-canton
          path: |
            reports/generated/canton_v105/
          if-no-files-found: warn
          retention-days: 30
