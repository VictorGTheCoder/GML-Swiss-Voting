name: Verify cleanup before merge

on:
  push:
    branches:
      - 20-implement-spec-federal-explanations

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow pdfplumber matplotlib pytest requests openpyxl pymupdf pytesseract Pillow ruff

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check scripts tests

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Validate notebook JSON
        run: python -m json.tool notebooks/datasets/federal_explanations/eda.ipynb > /dev/null
