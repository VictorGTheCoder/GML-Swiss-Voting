name: Clean federal explanations snapshot

on:
  push:
    branches:
      - cleanup-federal-processed

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup-federal-processed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas pyarrow matplotlib pytest jupyter nbconvert ipykernel pdfplumber requests openpyxl pymupdf pytesseract Pillow

      - name: Build clean processed snapshot
        run: |
          python scripts/build_federal_explanations_snapshot.py --input data/processed/federal_explanations --output /tmp/federal_clean
          rm -rf data/processed/federal_explanations
          mkdir -p data/processed/federal_explanations
          cp /tmp/federal_clean/*.parquet data/processed/federal_explanations/

      - name: Write concise processed README
        run: |
          cat > data/processed/federal_explanations/README.md <<'EOF'
          # Federal explanations
          
          Snapshot processed Chancellerie 2011–2026.
          
          - objects.parquet: clés et statuts de raccordement aux objets OFS
          - sections.parquet: contenu textuel extrait des brochures
          - pages.parquet: extraction page par page
          - sources.parquet: provenance des brochures
          - section_links.parquet: liens candidats section ↔ vote_id
          
          Aucune feature Swissvotes ni résultat communal OFS n'est exporté ici.
          Les audits techniques restent des artefacts intermédiaires et ne sont pas versionnés.
          EOF

      - name: Rewrite EDA for clean snapshot
        run: |
          cat > scripts/federal_explanations_eda.py <<'PY'
          """Generate reproducible EDA figures for the Federal Council explanations corpus."""
          
          from __future__ import annotations
          
          import argparse
          from pathlib import Path
          
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import pandas as pd
          
          
          def _save(fig: plt.Figure, path: Path) -> None:
              fig.tight_layout()
              fig.savefig(path, dpi=160, bbox_inches="tight")
              plt.close(fig)
          
          
          def plot_coverage_by_year(objects: pd.DataFrame, output_dir: Path) -> Path | None:
              frame = objects.copy()
              frame["vote_date"] = pd.to_datetime(frame["vote_date"], errors="coerce")
              frame = frame.dropna(subset=["vote_date"])
              if frame.empty:
                  return None
              frame["year"] = frame["vote_date"].dt.year
              fig, ax = plt.subplots(figsize=(11, 5.5))
              if "brochure_status" in frame.columns:
                  counts = frame.groupby(["year", "brochure_status"], dropna=False).size().unstack(fill_value=0).sort_index()
                  counts.plot(kind="bar", stacked=True, ax=ax)
                  ax.legend(title="Statut")
              else:
                  frame.groupby("year").size().sort_index().plot(kind="bar", ax=ax)
              ax.set_title("Objets de votation couverts par année")
              ax.set_xlabel("Année")
              ax.set_ylabel("Nombre d'objets")
              ax.tick_params(axis="x", rotation=45)
              path = output_dir / "coverage_by_year.png"
              _save(fig, path)
              return path
          
          
          def plot_extraction_quality(pages: pd.DataFrame, output_dir: Path) -> Path | None:
              if pages.empty or "method" not in pages.columns:
                  return None
              counts = pages["method"].fillna("unknown").astype(str).value_counts()
              fig, ax = plt.subplots(figsize=(7, 4.5))
              counts.plot(kind="bar", ax=ax)
              ax.set_title("Méthode d'extraction des pages")
              ax.set_xlabel("")
              ax.set_ylabel("Nombre")
              ax.tick_params(axis="x", rotation=0)
              path = output_dir / "extraction_quality.png"
              _save(fig, path)
              return path
          
          
          def plot_text_length_distribution(sections: pd.DataFrame, output_dir: Path) -> Path | None:
              if sections.empty or "full_text" not in sections.columns:
                  return None
              lengths = sections["full_text"].fillna("").astype(str).str.len()
              lengths = lengths[lengths > 0]
              if lengths.empty:
                  return None
              bins = max(5, min(30, round(len(lengths) ** 0.5)))
              fig, ax = plt.subplots(figsize=(8, 4.8))
              ax.hist(lengths, bins=bins)
              ax.set_title("Distribution de la longueur des textes par section")
              ax.set_xlabel("Nombre de caractères")
              ax.set_ylabel("Nombre de sections")
              path = output_dir / "text_length_distribution.png"
              _save(fig, path)
              return path
          
          
          def write_report(objects: pd.DataFrame, sections: pd.DataFrame, pages: pd.DataFrame, figures: list[Path], output_dir: Path) -> Path:
              lines = [
                  "# EDA — Explications du Conseil fédéral",
                  "",
                  f"- Objets OFS raccordés au corpus : **{len(objects)}**",
                  f"- Sections extraites : **{len(sections)}**",
                  f"- Pages extraites : **{len(pages)}**",
              ]
              dates = pd.to_datetime(objects["vote_date"], errors="coerce").dropna()
              if not dates.empty:
                  lines.append(f"- Période couverte : **{dates.min().date()} → {dates.max().date()}**")
              if "brochure_status" in objects.columns:
                  found = int((objects["brochure_status"] == "FOUND").sum())
                  lines.append(f"- Objets avec brochure trouvée : **{found}/{len(objects)}**")
              lines.extend(["", "## Extraction des pages", ""])
              for method, count in pages["method"].fillna("unknown").value_counts().items():
                  lines.append(f"- {method} : **{count}**")
              lengths = sections["full_text"].fillna("").astype(str).str.len()
              nonempty = lengths[lengths > 0]
              if not nonempty.empty:
                  lines.extend([
                      "", "## Texte extrait", "",
                      f"- Sections avec texte non vide : **{len(nonempty)}**",
                      f"- Longueur médiane : **{int(nonempty.median())} caractères**",
                      f"- Longueur moyenne : **{nonempty.mean():.0f} caractères**",
                  ])
              lines.extend(["", "## Figures", ""])
              for figure in figures:
                  lines.append(f"- [{figure.name}]({figure.name})")
              path = output_dir / "report.md"
              path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              return path
          
          
          def generate_eda(input_dir: Path, output_dir: Path) -> list[Path]:
              objects = pd.read_parquet(input_dir / "objects.parquet")
              sections = pd.read_parquet(input_dir / "sections.parquet")
              pages = pd.read_parquet(input_dir / "pages.parquet")
              output_dir.mkdir(parents=True, exist_ok=True)
              figures = [
                  figure for figure in (
                      plot_coverage_by_year(objects, output_dir),
                      plot_extraction_quality(pages, output_dir),
                      plot_text_length_distribution(sections, output_dir),
                  ) if figure is not None
              ]
              report = write_report(objects, sections, pages, figures, output_dir)
              return [*figures, report]
          
          
          def main() -> None:
              parser = argparse.ArgumentParser(description="Generate EDA figures for the federal explanations dataset")
              parser.add_argument("--input-dir", type=Path, required=True)
              parser.add_argument("--output-dir", type=Path, default=Path("reports/generated/federal_explanations/eda"))
              args = parser.parse_args()
              for path in generate_eda(args.input_dir, args.output_dir):
                  print(path)
          
          
          if __name__ == "__main__":
              main()
          PY

      - name: Rewrite EDA test
        run: |
          cat > tests/test_federal_explanations_eda.py <<'PY'
          from pathlib import Path
          
          import pandas as pd
          
          from scripts.federal_explanations_eda import generate_eda
          
          
          def test_generate_eda_from_synthetic_exports(tmp_path: Path) -> None:
              input_dir = tmp_path / "input"
              output_dir = tmp_path / "eda"
              input_dir.mkdir()
              pd.DataFrame({
                  "vote_id": ["6000", "6010", "6020", "6030"],
                  "vote_date": ["2020-02-09", "2020-09-27", "2021-03-07", "2021-06-13"],
                  "brochure_status": ["FOUND", "FOUND", "FOUND", "MISSING_OR_AMBIGUOUS"],
              }).to_parquet(input_dir / "objects.parquet", index=False)
              pd.DataFrame({
                  "object_id": ["s1", "s2", "s3"],
                  "full_text": ["A" * 1200, "B" * 1800, "C" * 900],
              }).to_parquet(input_dir / "sections.parquet", index=False)
              pd.DataFrame({
                  "source_id": ["a", "a", "b", "b", "c"],
                  "page_number": [1, 2, 1, 2, 1],
                  "method": ["native", "native", "native", "ocr", "native"],
              }).to_parquet(input_dir / "pages.parquet", index=False)
              generated = generate_eda(input_dir, output_dir)
              assert {path.name for path in generated} == {
                  "coverage_by_year.png",
                  "extraction_quality.png",
                  "text_length_distribution.png",
                  "report.md",
              }
              report = (output_dir / "report.md").read_text(encoding="utf-8")
              assert "Objets OFS raccordés au corpus : **4**" in report
              assert "Objets avec brochure trouvée : **3/4**" in report
              assert "ocr : **1**" in report
          PY

      - name: Update notebook paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          path = Path("notebooks/datasets/federal_explanations/eda.ipynb")
          nb = json.loads(path.read_text(encoding="utf-8"))
          for cell in nb["cells"]:
              src = "".join(cell.get("source", []))
              src = src.replace("coverage.parquet, sections.parquet, pages.parquet et model.parquet", "objects.parquet, sections.parquet et pages.parquet")
              src = src.replace('coverage = pd.read_parquet(INPUT_DIR / "coverage.parquet")', 'objects = pd.read_parquet(INPUT_DIR / "objects.parquet")')
              src = src.replace('model = pd.read_parquet(INPUT_DIR / "model.parquet")\n', "")
              src = src.replace('print(f"Coverage rows: {len(coverage)}")', 'print(f"Objects:       {len(objects)}")')
              src = src.replace('print(f"Model rows:    {len(model)}")\n', "")
              src = src.replace("coverage_preview = coverage[[", "coverage_preview = objects[[")
              src = src.replace("if column in coverage.columns", "if column in objects.columns")
              cell["source"] = src.splitlines(keepends=True)
          path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + "\n", encoding="utf-8")
          PY

      - name: Simplify dataset documentation
        run: |
          cat > docs/datasets/federal_explanations/README.md <<'EOF'
          # Explications du Conseil fédéral
          
          Ce dataset contient uniquement les données issues des brochures officielles de la Chancellerie fédérale nécessaires au projet.
          
          Swissvotes est utilisé dans le pipeline comme outil auxiliaire de contrôle d'identifiants. Ses thèmes, types juridiques et positions politiques ne sont pas exportés ici : ils appartiendront au dataset Swissvotes séparé.
          
          ## Snapshot versionné
          
          Le dossier data/processed/federal_explanations contient cinq tables :
          
          - objects.parquet : raccordement minimal aux vote_id OFS et statuts de validation
          - sections.parquet : texte, résumés et recommandations extraits
          - pages.parquet : texte page par page et méthode native/OCR
          - sources.parquet : provenance des brochures
          - section_links.parquet : liens candidats entre sections et vote_id
          
          ## Reproduction
          
          Le pipeline complet écrit d'abord ses artefacts techniques dans data/interim/federal_explanations_audit :
          
              python scripts/audit_federal_explanations_period.py --ofs data/processed/votes_communes.parquet --swissvotes data/raw/swissvotes.csv --sources data/raw/federal_explanations_sources.json --source-version 'DATASET CSV YYYY-MM-DD' --output data/interim/federal_explanations_audit
          
          Puis le snapshot propre est construit avec :
          
              python scripts/build_federal_explanations_snapshot.py --input data/interim/federal_explanations_audit --output data/processed/federal_explanations
          
          L'EDA se trouve dans notebooks/datasets/federal_explanations/eda.ipynb.
          EOF

      - name: Remove temporary workflows
        run: rm -f .github/workflows/inspect-federal-processed.yml .github/workflows/clean-federal-snapshot.yml

      - name: Run tests and notebook
        run: |
          python -m pytest -q
          jupyter nbconvert --to notebook --execute notebooks/datasets/federal_explanations/eda.ipynb --output /tmp/federal_eda.ipynb --ExecutePreprocessor.timeout=300

      - name: Verify clean processed directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          
          root = Path("data/processed/federal_explanations")
          expected = {"README.md", "objects.parquet", "sections.parquet", "pages.parquet", "sources.parquet", "section_links.parquet"}
          assert {p.name for p in root.iterdir()} == expected
          objects = pd.read_parquet(root / "objects.parquet")
          forbidden = [c for c in objects.columns if c.startswith("swissvotes_") or c in {"municipality_id", "yes_share", "turnout", "votes_yes", "votes_no"}]
          assert not forbidden, forbidden
          print(objects.columns.tolist())
          PY

      - name: Commit cleanup
        run: |
          git config user.name "Victor Giordani"
          git config user.email "112464371+VictorGTheCoder@users.noreply.github.com"
          git add -A
          git add -f data/processed/federal_explanations
          git commit -m "data: clean federal explanations processed snapshot"
          git push origin cleanup-federal-processed

