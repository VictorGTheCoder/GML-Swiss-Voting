name: Clean federal explanations snapshot

on:
  push:
    branches:
      - cleanup/federal-explanations-processed

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/federal-explanations-processed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas pyarrow matplotlib pytest

      - name: Build clean snapshot
        run: |
          python scripts/build_federal_explanations_snapshot.py \
            --input data/processed/federal_explanations \
            --output /tmp/federal_clean
          rm -rf data/processed/federal_explanations
          mkdir -p data/processed/federal_explanations
          cp /tmp/federal_clean/*.parquet data/processed/federal_explanations/

      - name: Verify clean snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("data/processed/federal_explanations")
          expected = {
              "objects.parquet",
              "sections.parquet",
              "pages.parquet",
              "sources.parquet",
              "section_links.parquet",
          }
          assert {p.name for p in root.iterdir()} == expected

          objects = pd.read_parquet(root / "objects.parquet")
          forbidden = [
              c for c in objects.columns
              if c.startswith("swissvotes_")
              or c in {
                  "municipality_id",
                  "municipality_name",
                  "yes_share",
                  "turnout",
                  "votes_yes",
                  "votes_no",
              }
          ]
          assert not forbidden, forbidden
          print(objects.columns.tolist())
          PY

      - name: Run tests and EDA
        run: |
          python -m pytest -q
          python scripts/federal_explanations_eda.py \
            --input-dir data/processed/federal_explanations \
            --output-dir /tmp/federal_eda
          test -s /tmp/federal_eda/coverage_by_year.png
          test -s /tmp/federal_eda/extraction_quality.png
          test -s /tmp/federal_eda/text_length_distribution.png
          test -s /tmp/federal_eda/report.md

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/inspect-federal-processed.yml
          rm -f .github/workflows/clean-federal-snapshot.yml

      - name: Commit cleaned snapshot
        run: |
          git config user.name "Victor Giordani"
          git config user.email "112464371+VictorGTheCoder@users.noreply.github.com"
          git add -A
          git add -f data/processed/federal_explanations
          git commit -m "data: clean federal explanations processed snapshot"
          git push origin cleanup/federal-explanations-processed
