name: V11.2 documentary mechanisms
on:
  pull_request:
    paths:
      - 'scripts/modeling/documentary_v112.py'
      - 'scripts/modeling/documentary_audit_v112.py'
      - 'tests/test_documentary_v112.py'
      - '.github/workflows/documentary-v112.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_documentary_v112.py
      - uses: actions/download-artifact@v4
        with:
          name: v1089-acquisition-text
          run-id: 45367633898
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v112_text
      - uses: actions/download-artifact@v4
        with:
          name: v1089-results-text
          run-id: 45367633898
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v112_frozen
      - uses: actions/download-artifact@v4
        with:
          name: poll-acquisition-v81
          run-id: 45292731014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/acquisition_v81
      - uses: actions/download-artifact@v4
        with:
          name: national-fusion-v81
          run-id: 45293115635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/national_v81
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/v112_base
      - run: python -m scripts.modeling.documentary_v112 --base reports/generated/v112_base --acquisition reports/generated/v112_text --old-acquisition reports/generated/acquisition_v81 --fusion reports/generated/national_v81 --frozen reports/generated/v112_frozen --output reports/generated/v112_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v112-documentary
          path: reports/generated/v112_results/
          retention-days: 30
          if-no-files-found: warn
