name: V25.1 stability audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/stability-v251.yml'
      - 'scripts/modeling/stability_v251.py'
      - 'tests/test_stability_v251.py'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_stability_v251.py
      - uses: actions/download-artifact@v4
        with:
          name: v241-robust-heads
          run-id: 46060624437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v251_input
      - run: python -m scripts.modeling.stability_v251 --input reports/generated/v251_input/object_metrics.csv --output reports/generated/v251_results/stability.json
      - uses: actions/upload-artifact@v4
        with:
          name: v251-stability
          path: reports/generated/v251_results/
          retention-days: 30
