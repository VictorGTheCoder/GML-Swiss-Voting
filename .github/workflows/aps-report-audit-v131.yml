name: V13.1 APS report cover audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pypdf
      - run: python -m pytest -q tests/test_aps_audit_v131.py tests/test_aps_report_audit_v131.py
      - run: python -m scripts.modeling.aps_report_audit_v131 --output reports/generated/v131/reports.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v131-aps-report-audit
          path: reports/generated/v131/
          retention-days: 30
          if-no-files-found: warn
