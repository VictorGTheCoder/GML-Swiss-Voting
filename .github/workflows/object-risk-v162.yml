name: V16.2 object risk diagnostic
on:
  pull_request:
    paths:
      - 'scripts/modeling/object_risk_v162.py'
      - 'tests/test_object_risk_v162.py'
      - '.github/workflows/object-risk-v162.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_object_risk_v162.py
      - uses: actions/download-artifact@v4
        with:
          name: v113-procedure
          run-id: 45444093555
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v162_source
      - run: python -m scripts.modeling.object_risk_v162 --source reports/generated/v162_source --output reports/generated/v162_results
      - uses: actions/upload-artifact@v4
        with:
          name: v162-object-risk
          path: reports/generated/v162_results/
          retention-days: 30
          if-no-files-found: error
