name: Verify federal explanations EDA
# Temporary verification workflow for branch-local EDA validation.

on:
  push:
    branches:
      - 20-implement-spec-federal-explanations

jobs:
  verify-eda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EDA dependencies
        run: python -m pip install --upgrade pip pandas pyarrow matplotlib pytest

      - name: Run EDA unit test
        run: python -m pytest tests/test_federal_explanations_eda.py -q

      - name: Run EDA on tracked 2011-2026 artifacts
        run: |
          python scripts/federal_explanations_eda.py \
            --input-dir reports/federal_explanations/artifacts \
            --output-dir /tmp/federal_explanations_eda
          test -s /tmp/federal_explanations_eda/coverage_by_year.png
          test -s /tmp/federal_explanations_eda/extraction_quality.png
          test -s /tmp/federal_explanations_eda/text_length_distribution.png
          test -s /tmp/federal_explanations_eda/report.md
          cat /tmp/federal_explanations_eda/report.md
