name: V8 regional anchoring and geographic oracle
on:
  pull_request:
    paths:
      - 'scripts/modeling/regional_anchor_v8.py'
      - 'tests/test_regional_anchor_v8.py'
      - 'data/external/polls_regional_v8/**'
      - '.github/workflows/regional-anchor-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-experiments.txt
      - name: Verify national coherence and publication cutoff
        run: python -m pytest -q tests/test_regional_anchor_v8.py
      - uses: actions/download-artifact@v4
        with:
          name: inductive-profiles-v8
          run-id: 45288455272
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/inductive_v8
      - name: Prepare historical data
        run: >-
          python -m scripts.modeling.municipal_v2 prepare
          --output reports/generated/regional_v8_base
      - name: Evaluate real regional polls separately from hindsight oracles
        run: >-
          python -m scripts.modeling.regional_anchor_v8
          --base reports/generated/regional_v8_base
          --inductive reports/generated/inductive_v8
          --regional data/external/polls_regional_v8/regional_polls.csv
          --output reports/generated/regional_v8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-anchor-v8
          path: reports/generated/regional_v8/
          if-no-files-found: warn
          retention-days: 30
