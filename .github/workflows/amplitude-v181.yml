name: V18.1 chronological amplitude calibration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m scripts.modeling.amplitude_v181 --self-test
      - uses: actions/download-artifact@v4
        with:
          name: v113-procedure
          run-id: 45444093555
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v181_source
      - run: python -m scripts.modeling.amplitude_v181 --source reports/generated/v181_source --output reports/generated/v181_results
      - uses: actions/upload-artifact@v4
        with:
          name: v181-amplitude
          path: reports/generated/v181_results/
          retention-days: 30
          if-no-files-found: error
