name: V10.9 corrected tax data and V10.10 chronological ensemble
on:
  pull_request:
    paths:
      - 'scripts/modeling/income_v109.py'
      - 'scripts/modeling/ensemble_v1010.py'
      - 'tests/test_ensemble_v1010.py'
      - '.github/workflows/ensemble-v1010.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
jobs:
  income:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt openpyxl
      - run: python -m pytest -q tests/test_enrichment_v1089.py
      - uses: actions/download-artifact@v4
        with:
          name: v1089-audit-income
          run-id: 45366979764
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/income_raw
      - uses: actions/download-artifact@v4
        with:
          name: v1089-acquisition-income
          run-id: 45367633898
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/frozen_geography
      - run: python -m scripts.modeling.income_v109 --input reports/generated/income_raw --geography reports/generated/frozen_geography --output reports/generated/income_corrected
      - uses: actions/upload-artifact@v4
        with:
          name: v109-corrected-acquisition
          path: reports/generated/income_corrected/
          retention-days: 30
      - uses: actions/download-artifact@v4
        with:
          name: poll-acquisition-v81
          run-id: 45292731014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/acquisition_v81
      - uses: actions/download-artifact@v4
        with:
          name: national-fusion-v81
          run-id: 45293115635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/national_v81
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/v109_base
      - run: python -m scripts.modeling.enrichment_v1089 --suite income --base reports/generated/v109_base --acquisition reports/generated/income_corrected --old-acquisition reports/generated/acquisition_v81 --fusion reports/generated/national_v81 --output reports/generated/v109_corrected_results
      - uses: actions/upload-artifact@v4
        with:
          name: v109-corrected-results
          path: reports/generated/v109_corrected_results/
          retention-days: 30
  ensemble:
    needs: income
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt openpyxl
      - run: python -m pytest -q tests/test_ensemble_v1010.py
      - uses: actions/download-artifact@v4
        with:
          name: v101-expectation-pilot
          run-id: 45301813438
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v101
      - uses: actions/download-artifact@v4
        with:
          name: v102-media-pilot
          run-id: 45309749540
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v102
      - uses: actions/download-artifact@v4
        with:
          name: v103-turnout
          run-id: 45316679885
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v103
      - uses: actions/download-artifact@v4
        with:
          name: v104-pooling
          run-id: 45323525729
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v104
      - uses: actions/download-artifact@v4
        with:
          name: v105-canton
          run-id: 45344880395
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v105
      - uses: actions/download-artifact@v4
        with:
          name: v106-reconciliation
          run-id: 45358533701
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v106
      - uses: actions/download-artifact@v4
        with:
          name: v107-hybrid
          run-id: 45361300769
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v107
      - uses: actions/download-artifact@v4
        with:
          name: v1089-results-text
          run-id: 45367633898
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v1010_inputs/v108
      - uses: actions/download-artifact@v4
        with:
          name: v109-corrected-results
          path: reports/generated/v1010_inputs/v109
      - run: python -m scripts.modeling.ensemble_v1010 --inputs reports/generated/v1010_inputs --output reports/generated/v1010_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1010-ensemble
          path: reports/generated/v1010_results/
          if-no-files-found: warn
          retention-days: 30
