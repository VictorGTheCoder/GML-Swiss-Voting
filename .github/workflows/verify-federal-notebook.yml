name: Verify federal explanations notebook

on:
  push:
    branches:
      - 20-implement-spec-federal-explanations

jobs:
  verify-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install notebook dependencies
        run: python -m pip install --upgrade pip pandas pyarrow matplotlib jupyter nbconvert ipykernel

      - name: Execute EDA notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/02_federal_explanations_eda.ipynb \
            --output /tmp/02_federal_explanations_eda.executed.ipynb \
            --ExecutePreprocessor.timeout=300
          test -s reports/federal_explanations_eda/coverage_by_year.png
          test -s reports/federal_explanations_eda/extraction_quality.png
          test -s reports/federal_explanations_eda/text_length_distribution.png
          test -s reports/federal_explanations_eda/report.md
