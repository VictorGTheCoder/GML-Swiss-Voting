name: Gradiom versus frozen GML matched replay
on:
  pull_request:
    paths:
      - 'scripts/modeling/compare_gradiom_gml.py'
      - 'tests/test_compare_gradiom_gml.py'
      - '.github/workflows/gradiom-gml-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_compare_gradiom_gml.py
      - uses: actions/download-artifact@v4
        with:
          name: gradiom-historical-benchmark
          run-id: 45372903533
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/gradiom_benchmark
      - uses: actions/download-artifact@v4
        with:
          name: v1089-acquisition-text
          run-id: 45367633898
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v108_corpus
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/gradiom_gml_base
      - run: python -m scripts.modeling.compare_gradiom_gml --base reports/generated/gradiom_gml_base --archive reports/generated/gradiom_benchmark --corpus reports/generated/v108_corpus --output reports/generated/gradiom_gml_comparison
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradiom-gml-matched
          path: reports/generated/gradiom_gml_comparison/
          retention-days: 30
          if-no-files-found: warn
