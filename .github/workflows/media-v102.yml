name: V10.2 historical media pilot
on:
  pull_request:
    paths:
      - 'scripts/modeling/media_v102.py'
      - 'tests/test_media_v102.py'
      - 'data/external/media_v10/**'
      - '.github/workflows/media-v102.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_media_v102.py
      - uses: actions/download-artifact@v4
        with:
          name: poll-acquisition-v81
          run-id: 45292731014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/acquisition_v81
      - uses: actions/download-artifact@v4
        with:
          name: national-fusion-v81
          run-id: 45293115635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/national_v81
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/v102_base
      - run: python -m scripts.modeling.media_v102 --base reports/generated/v102_base --acquisition reports/generated/acquisition_v81 --fusion reports/generated/national_v81 --source data/external/media_v10/reviewed.csv --output reports/generated/media_v102
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v102-media-pilot
          path: |
            reports/generated/media_v102/
          if-no-files-found: warn
          retention-days: 30
