name: Frozen V5 error diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-v5-errors.yml'
      - 'scripts/modeling/diagnose_v5_errors.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install diagnostic dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 pyarrow threadpoolctl
      - uses: actions/download-artifact@v4
        with:
          name: semantic-v5-historical-benchmark
          run-id: 45241043829
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/frozen_v5_input
      - name: Diagnose immutable paired predictions
        run: >-
          python -m scripts.modeling.diagnose_v5_errors
          --artifact reports/generated/frozen_v5_input
          --output reports/generated/v5_error_diagnostics
      - uses: actions/upload-artifact@v4
        with:
          name: v5-error-diagnostics
          path: reports/generated/v5_error_diagnostics/
          if-no-files-found: error
