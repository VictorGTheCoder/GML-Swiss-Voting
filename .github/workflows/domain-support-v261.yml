name: V26.1 domain support audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/domain-support-v261.yml'
      - 'scripts/modeling/domain_support_v261.py'
      - 'tests/test_domain_support_v261.py'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_domain_support_v261.py tests/test_stability_v251.py
      - uses: actions/download-artifact@v4
        with:
          name: v241-robust-heads
          run-id: 46060624437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v261_input
      - run: python -m scripts.modeling.domain_support_v261 --input reports/generated/v261_input/object_metrics.csv --output reports/generated/v261_results/domain_support.json
      - uses: actions/upload-artifact@v4
        with:
          name: v261-domain-support
          path: reports/generated/v261_results/
          retention-days: 30
