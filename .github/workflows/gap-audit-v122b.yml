name: V12.2b same-date gap audit
on:
  pull_request:
    paths:
      - 'scripts/modeling/gap_audit_v122b.py'
      - 'tests/test_gap_audit_v122b.py'
      - '.github/workflows/gap-audit-v122b.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_gap_audit_v122b.py
      - uses: actions/download-artifact@v4
        with:
          name: v1089-acquisition-text
          run-id: 45367633898
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v122b_text
      - run: python -m scripts.modeling.gap_audit_v122b --acquisition reports/generated/v122b_text --output reports/generated/v122b_audit/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v122b-gap-audit
          path: reports/generated/v122b_audit/
          retention-days: 30
          if-no-files-found: warn
