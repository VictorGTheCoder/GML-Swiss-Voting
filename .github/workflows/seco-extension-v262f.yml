name: V26.2f August 2018 SECO acquisition and extraction
on:
  workflow_dispatch:
concurrency:
  group: v262f-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  acquire:
    if: github.head_ref == 'experiment/municipal-v13-aps-source-20261125' || github.ref == 'refs/heads/experiment/municipal-v13-aps-source-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pandas openpyxl
      - run: python -m pytest -q tests/test_seco_vintages_v262.py tests/test_seco_extract_v262e.py
      - uses: actions/download-artifact@v4
        with:
          name: v241-robust-heads
          run-id: 46060624437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v262_roster
      - run: python -m scripts.modeling.seco_vintages_v262 --catalog reports/experiments/v26_campaign/V26.2f-candidates.json --roster reports/generated/v262_roster/object_metrics.csv --output reports/generated/v262f_results/audit.json
      - run: jq -e '.format_checked == 1 and .training_rows_admitted == 0' reports/generated/v262f_results/audit.json
      - run: python -m scripts.modeling.seco_extract_v262e --audit reports/generated/v262f_results/audit.json --output reports/generated/v262f_results/extraction.json
      - run: jq -e '.complete_archives == 1 and .training_rows_admitted == 0' reports/generated/v262f_results/extraction.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v262f-seco-extension
          path: reports/generated/v262f_results/
          retention-days: 30
