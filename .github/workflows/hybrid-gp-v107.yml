name: V10.7 hybrid Gaussian profiles
on:
  pull_request:
    paths:
      - 'scripts/modeling/hybrid_gp_v107.py'
      - 'tests/test_hybrid_gp_v107.py'
      - '.github/workflows/hybrid-gp-v107.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_hybrid_gp_v107.py
      - uses: actions/download-artifact@v4
        with:
          name: poll-acquisition-v81
          run-id: 45292731014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/acquisition_v81
      - uses: actions/download-artifact@v4
        with:
          name: national-fusion-v81
          run-id: 45293115635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/national_v81
      - uses: actions/download-artifact@v4
        with:
          name: v105-canton
          run-id: 45344880395
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/canton_v105
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/v107_base
      - run: python -m scripts.modeling.hybrid_gp_v107 --base reports/generated/v107_base --acquisition reports/generated/acquisition_v81 --fusion reports/generated/national_v81 --frozen reports/generated/canton_v105 --output reports/generated/hybrid_v107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v107-hybrid
          path: reports/generated/hybrid_v107/
          if-no-files-found: warn
          retention-days: 30
