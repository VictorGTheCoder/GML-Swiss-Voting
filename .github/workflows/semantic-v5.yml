name: Historical semantic inventory V5

on:
  pull_request:
    paths:
      - '.github/workflows/semantic-v5.yml'
      - 'scripts/modeling/historical_objects_v5.py'
      - 'scripts/modeling/semantic_labels_v5.py'
      - 'scripts/modeling/semantic_training_v5.py'
      - 'data/annotations/yes_effects_historical_v5.json'
      - 'experiments/municipal_v5/**'
      - 'tests/test_semantic_v5.py'
  workflow_dispatch:

jobs:
  historical-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install metadata dependencies
        run: python -m pip install pandas pyarrow
      - name: Print 1990-2015 Swissvotes titles and IDs (no results)
        run: >-
          python -m scripts.modeling.historical_objects_v5
          --start-year 1990 --end-year 2015
          --output reports/generated/semantic_v5/historic_inventory.csv
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-v5-historical-object-inventory
          path: reports/generated/semantic_v5/historic_inventory.csv
