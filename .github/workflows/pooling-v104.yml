name: V10.4 aggregate partial pooling
on:
  pull_request:
    paths:
      - 'scripts/modeling/pooling_v104.py'
      - 'tests/test_pooling_v104.py'
      - '.github/workflows/pooling-v104.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pooling:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_pooling_v104.py
      - uses: actions/download-artifact@v4
        with:
          name: poll-acquisition-v81
          run-id: 45292731014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/acquisition_v81
      - uses: actions/download-artifact@v4
        with:
          name: national-fusion-v81
          run-id: 45293115635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/national_v81
      - uses: actions/download-artifact@v4
        with:
          name: v103-turnout
          run-id: 45316679885
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/turnout_v103
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/v104_base
      - run: python -m scripts.modeling.pooling_v104 --base reports/generated/v104_base --acquisition reports/generated/acquisition_v81 --fusion reports/generated/national_v81 --turnout reports/generated/turnout_v103 --output reports/generated/pooling_v104
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v104-pooling
          path: |
            reports/generated/pooling_v104/
          if-no-files-found: warn
          retention-days: 30
