name: V18.3 two-scale contrast ablation
on:
  pull_request:
    paths:
      - 'scripts/modeling/two_scale_v183.py'
      - '.github/workflows/two-scale-v183.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m scripts.modeling.two_scale_v183 --self-test
      - uses: actions/download-artifact@v4
        with:
          name: v113-procedure
          run-id: 45444093555
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v183_source
      - run: python -m scripts.modeling.two_scale_v183 --source reports/generated/v183_source --output reports/generated/v183_results
      - uses: actions/upload-artifact@v4
        with:
          name: v183-two-scale
          path: reports/generated/v183_results/
          retention-days: 30
          if-no-files-found: error
