name: V14 AFF pinned content audit
on:
  workflow_dispatch:
  pull_request:
    branches:
      - experiment/municipal-v12-document-coverage-20261125
    paths:
      - '.github/workflows/municipal-v14-aff-content.yml'
      - 'experiments/municipal_v14/audit_aff_content.py'
permissions:
  contents: read
concurrency:
  group: v14-aff-content-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.head_ref == 'experiment/municipal-v13-aps-source-20261125' || github.ref == 'refs/heads/experiment/municipal-v13-aps-source-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text utility
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Audit pinned archives
        run: python experiments/municipal_v14/audit_aff_content.py aff-content-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v14-aff-content-metadata
          path: aff-content-audit.json
          if-no-files-found: error
