name: V8 regional poll acquisition
on:
  pull_request:
    paths:
      - 'scripts/modeling/collect_regional_polls_v8.py'
      - '.github/workflows/collect-regional-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas requests
      - run: >-
          python -m scripts.modeling.collect_regional_polls_v8
          --output reports/generated/regional_v8_acquisition
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-v8-source-evidence
          path: reports/generated/regional_v8_acquisition/
          if-no-files-found: warn
