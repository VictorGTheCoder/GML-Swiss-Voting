name: V27.1 shared vector-leaf heads
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/shared-v271.yml'
      - 'scripts/modeling/shared_v271.py'
      - 'tests/test_shared_v271.py'
concurrency:
  group: v271-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  procedure:
    if: github.head_ref == 'experiment/municipal-v13-aps-source-20261125' || github.ref == 'refs/heads/experiment/municipal-v13-aps-source-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_shared_v271.py
      - uses: actions/download-artifact@v4
        with:
          name: v1089-acquisition-text
          run-id: 45367633898
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v271_text
      - uses: actions/download-artifact@v4
        with:
          name: v241-robust-heads
          run-id: 46060624437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v271_frozen
      - uses: actions/download-artifact@v4
        with:
          name: poll-acquisition-v81
          run-id: 45292731014
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/acquisition_v81
      - uses: actions/download-artifact@v4
        with:
          name: national-fusion-v81
          run-id: 45293115635
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/national_v81
      - run: python -m scripts.modeling.municipal_v2 prepare --output reports/generated/v271_base
      - run: python -m scripts.modeling.shared_v271 --base reports/generated/v271_base --acquisition reports/generated/v271_text --old-acquisition reports/generated/acquisition_v81 --fusion reports/generated/national_v81 --frozen reports/generated/v271_frozen --output reports/generated/v271_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v271-shared-heads
          path: reports/generated/v271_results/
          retention-days: 30
          if-no-files-found: warn
