name: V19.3 structured parliamentary source pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v193-structured-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/municipal_v19/audit_structured.mjs --self-test
      - run: node experiments/municipal_v19/audit_structured.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v193-structured
          path: artifacts/v193-structured/manifest.json
          if-no-files-found: error
