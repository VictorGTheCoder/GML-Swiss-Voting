name: V23.1 procedural catalogue metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node experiments/municipal_v23/audit_catalogue.mjs --self-test
      - run: node experiments/municipal_v23/audit_catalogue.mjs v231-catalogue.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v231-catalogue
          path: v231-catalogue.json
          if-no-files-found: warn
          retention-days: 30
