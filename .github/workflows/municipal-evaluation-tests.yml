name: Municipal evaluation regression tests

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/test_evaluate_*.py"
      - "tests/test_final_evaluation.py"
      - ".github/workflows/municipal-evaluation-tests.yml"
  workflow_dispatch:

jobs:
  municipal-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install numpy pandas scipy scikit-learn pytest
      - name: Run municipal evaluation regressions
        run: python -m pytest -q tests/test_evaluate_features.py tests/test_evaluate_geography.py tests/test_final_evaluation.py
