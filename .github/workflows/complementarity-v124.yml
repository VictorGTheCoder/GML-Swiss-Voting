name: V12.4 national and local complementarity
on:
  push:
    branches:
      - 'experiment/municipal-v12-document-coverage-20261125'
    paths:
      - '.github/workflows/complementarity-v124.yml'
      - 'scripts/modeling/complementarity_v124.py'
      - 'tests/test_complementarity_v124.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  complementarity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - run: pip install -r requirements-experiments.txt
      - run: python -m pytest -q tests/test_complementarity_v124.py
      - uses: actions/download-artifact@v4
        with:
          name: v123-multiview
          run-id: 45581661878
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reports/generated/v124_source
      - run: python -m scripts.modeling.complementarity_v124 --source reports/generated/v124_source --output reports/generated/v124_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v124-complementarity
          path: reports/generated/v124_results/
          retention-days: 30
          if-no-files-found: warn
