name: XGBoost extended capacity stress test
on:
  pull_request:
    paths:
      - '.github/workflows/xgboost-extended.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-experiments.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-experiments.txt
      - name: Verify standard and extended audit
        run: python -m pytest -q tests/test_xgboost_capacity.py
      - name: Prepare original historical snapshot
        run: >-
          python -m scripts.modeling.municipal_v2 prepare
          --output reports/generated/extended_base
      - name: Stress test deep trees and long training
        run: >-
          python -m scripts.modeling.audit_xgboost_capacity
          --base reports/generated/extended_base
          --feature-set v3 --extended
          --output reports/generated/capacity_extended
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xgboost-capacity-extended-v3
          path: reports/generated/capacity_extended/
          if-no-files-found: warn
          retention-days: 30
